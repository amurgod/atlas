apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlas
resources:
  - namespace.yaml
  - configmap.yaml
  - nats.yaml
  - workloads.yaml
  - open-webui-engine.yaml
  - gateway.yaml
  - ingress.yaml
  - provider.yaml
configMapGenerator:
  - name: gateway-nginx
    files:
      - default.conf=gateway-default.conf
    options:
      disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/part-of: atlas
    includeSelectors: false
    includeTemplates: true
