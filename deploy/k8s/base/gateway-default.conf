server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;

    location /api/user/ {
        proxy_pass http://user-service:8080/;
    }
    location /api/knowledge/ {
        proxy_pass http://knowledge-service:8080/;
    }
    location /api/planner/ {
        proxy_pass http://planner-service:8080/;
    }
    location /api/notify/ {
        proxy_pass http://notification-service:8080/;
    }
    location /api/engine/v1/ws {
        proxy_pass http://open-webui-engine:8080/v1/ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location /api/engine/ {
        proxy_pass http://open-webui-engine:8080/;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://ui:80;
    }
}
