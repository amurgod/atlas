apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: providers.atlas.platform
spec:
  group: atlas.platform
  scope: Namespaced
  names:
    kind: Provider
    listKind: ProviderList
    plural: providers
    singular: provider
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [type, models]
              properties:
                type:
                  type: string
                  description: openai, anthropic (or claude), grok, or gemini
                apiKey:
                  type: string
                baseURL:
                  type: string
                models:
                  type: array
                  items:
                    type: object
                    required: [name, usage]
                    properties:
                      name:
                        type: string
                      usage:
                        type: string
                        description: chat, reasoning, or another use the caller names
                      temperature:
                        type: number
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-gateway-providers
rules:
  - apiGroups: ["atlas.platform"]
    resources: ["providers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-gateway-providers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-gateway-providers
subjects:
  - kind: ServiceAccount
    name: llm-gateway
