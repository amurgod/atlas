apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlas
resources:
  - ../../base
  - postgres.yaml
  - minio.yaml
patches:
  - path: s3-config.yaml
  - path: ingress-lan.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: atlas
secretGenerator:
  - name: atlas-secrets
    literals:
      - JWT_SECRET=local-dev-jwt-secret-change-me-ok
      - POSTGRES_PASSWORD=atlas
      - DATABASE_URL=postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      - ANTHROPIC_API_KEY=
      - COMPLETIONS_API_KEY=
      - VOYAGE_API_KEY=
      - SES_FROM=
      - TWILIO_SID=
      - TWILIO_TOKEN=
      - TWILIO_FROM=
      - S3_ACCESS_KEY=atlas
      - S3_SECRET_KEY=atlasatlas
    options:
      disableNameSuffixHash: true
