services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"

  llm-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: llm-gateway
    environment:
      HTTP_ADDR: ":8080"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
      VOYAGE_MODEL: voyage-3
      EMBED_DIM: "1024"
      COMPLETIONS_API_KEY: "${COMPLETIONS_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      COMPLETIONS_BASE_URL: "${COMPLETIONS_BASE_URL:-https://api.openai.com/v1}"
      COMPLETIONS_MODEL: "${COMPLETIONS_MODEL:-gpt-4o-mini}"
      COMPLETIONS_API: "${COMPLETIONS_API:-chat}"
      COMPLETION_PROVIDER: "${COMPLETION_PROVIDER:-auto}"
    networks:
      default:
        aliases: [llm-gateway]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - llm-gateway
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_AUTH: "false"
      WEBUI_SECRET_KEY: atlas-local-open-webui
      OPENAI_API_BASE_URL: http://llm-gateway:8080/v1
      OPENAI_API_KEY: atlas
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://llm-gateway:8080/v1
      RAG_OPENAI_API_KEY: atlas
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    networks:
      default:
        aliases: [open-webui]

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlasatlas
    ports:
      - "9000:9000"
    volumes:
      - minio:/data
    networks:
      default:
        aliases: [minio]

  user:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: user
    environment: &svc-env
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: local-dev-jwt-secret-change-me-ok
      LLM_GATEWAY_URL: http://llm-gateway:8080
      NOTIFY_MODE: log
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      default:
        aliases: [user-service]

  open-webui-engine:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: open-webui-engine
    environment:
      <<: *svc-env
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: atlas-docs
      S3_REGION: us-east-1
      S3_ACCESS_KEY: atlas
      S3_SECRET_KEY: atlasatlas
      S3_PATH_STYLE: "true"
      VECTOR_BACKEND: pgvector
      OPEN_WEBUI_URL: http://open-webui:8080
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      llm-gateway:
        condition: service_started
      minio:
        condition: service_started
      open-webui:
        condition: service_started
    networks:
      default:
        aliases: [open-webui-engine]

  knowledge:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: knowledge
    environment:
      <<: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      llm-gateway:
        condition: service_started
    networks:
      default:
        aliases: [knowledge-service]

  planner:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: planner
    environment:
      <<: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      llm-gateway:
        condition: service_started
    networks:
      default:
        aliases: [planner-service]

  notification:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: notification
    environment:
      <<: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      default:
        aliases: [notification-service]

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    networks:
      default:
        aliases: [ui]

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - ui
      - user
      - knowledge
      - planner
      - notification
      - open-webui
      - open-webui-engine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  open-webui:
  minio:
